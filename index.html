<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maa Kali Rewards</title>
<link rel="stylesheet" href="style.css">
<style>
  body { 
    font-family: Arial, sans-serif; 
    text-align: center; 
    padding: 30px 15px; 
    background-color: #f9f9f9; 
  }
  h1 { 
    color: #b71c1c; 
    margin-bottom: 5px; 
  }
  p { 
    color: #555; 
    font-size: 16px; 
  }
  .btn { 
    background-color: #b71c1c; 
    color: white; 
    border: none; 
    padding: 14px 28px; 
    font-size: 18px; 
    font-weight: bold; 
    border-radius: 8px; 
    cursor: pointer; 
    margin-top: 20px; 
    box-shadow: 0 4px 10px rgba(0,0,0,0.15); 
  }
  .btn:active { 
    transform: scale(0.98); 
  }
  #rewardDisplay { 
    margin: 25px auto 0; 
    max-width: 320px; 
    font-size: 18px; 
    font-weight: bold; 
    padding: 15px; 
    border-radius: 10px; 
    display: none; 
    line-height: 1.5; 
  }
</style>
</head>
<body>

<h1>🎁 Maa Kali Rewards</h1>
<p>Welcome to Maa Kali Vastralaya</p>

<button class="btn" onclick="openMyReward()">Open Your Reward</button>

<div id="rewardDisplay"></div>

<script>
const REWARD_URL = "https://maa-kali-rewards-default-rtdb.firebaseio.com/reward.json";
const STATUS_URL = "https://maa-kali-rewards-default-rtdb.firebaseio.com/status.json";

function openMyReward() {
    const display = document.getElementById("rewardDisplay");
    display.style.display = "block";
    display.style.color = "#e65100";
    display.style.backgroundColor = "#fff3e0";
    display.style.border = "2px dashed #ffe0b2";
    display.innerText = "⏳ Checking...";

    // 1. Firebase se Admin Switch ka status check karein
    fetch(STATUS_URL)
    .then(res => res.json())
    .then(statusData => {
        if (statusData && statusData.active === "ON") {
            
            // 🛑 Automatic Switch OFF kar dein taaki dobara access block ho jaye
            fetch(STATUS_URL, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ active: "OFF" })
            });

            // 🎁 Customer ko Reward Dikhayein
            fetch(REWARD_URL)
            .then(res => res.json())
            .then(data => {
                if (data && data.selectedReward) {
                    display.style.color = "#2e7d32";
                    display.style.backgroundColor = "#e8f5e9";
                    display.style.border = "2px solid #a5d6a7";
                    display.innerText = "🎉 CONGRATULATIONS!\n\n" + data.selectedReward;
                } else {
                    display.innerText = "❌ Abhi koi reward set nahi hai.";
                }
            });

        } else {
            // Status OFF hone par ye message dikhega
            display.style.color = "#d84315";
            display.style.backgroundColor = "#fbe9e7";
            display.style.border = "2px dashed #ffab91";
            display.innerText = "🛍️ Reward paane ke liye pehle kharidari karein!";
        }
    })
    .catch(err => {
        display.style.color = "#c62828";
        display.style.backgroundColor = "#ffebee";
        display.innerText = "❌ Network Error! Internet check karke dobara try karein.";
    });
}
</script>

</body>
</html>
