<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maa Kali Rewards - Spin & Win</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
  body { background: radial-gradient(circle at top, #111827 0%, #030712 100%); color: #ffffff; text-align: center; padding: 20px 15px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; }
  
  h1 { background: linear-gradient(180deg, #FF9933 20%, #FFFFFF 50%, #138808 80%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 22px; font-weight: 800; margin-bottom: 5px; }
  .subtitle { color: #cbd5e1; font-size: 13px; margin-bottom: 15px; }

  /* Wheel Box */
  .wheel-box { position: relative; width: 310px; height: 310px; margin: 25px auto; border-radius: 50%; padding: 6px; background: linear-gradient(135deg, #FF9933, #FFFFFF, #138808); box-shadow: 0 0 30px rgba(255, 153, 51, 0.4); }
  
  /* Pointer (Pin) */
  .pointer { position: absolute; top: -20px; left: 50%; transform: translateX(-50%); width: 0; height: 0; border-left: 18px solid transparent; border-right: 18px solid transparent; border-top: 32px solid #FF9933; z-index: 10; filter: drop-shadow(0 4px 5px rgba(0,0,0,0.5)); }

  #wheelCanvas { width: 100%; height: 100%; border-radius: 50%; display: block; }
  
  .btn-spin { background: linear-gradient(135deg, #FF9933, #138808); color: #ffffff; border: 2px solid #ffffff; padding: 14px 35px; font-size: 16px; font-weight: 800; border-radius: 50px; cursor: pointer; width: 100%; max-width: 280px; box-shadow: 0 6px 20px rgba(255, 153, 51, 0.5); }
  .btn-spin:active { transform: scale(0.95); }
  
  #rewardDisplay { margin: 20px auto 0; width: 100%; max-width: 300px; font-size: 15px; font-weight: 600; padding: 15px; border-radius: 12px; display: none; white-space: pre-line; border: 1px solid #FF9933; background: rgba(255, 153, 51, 0.1); }

  /* WhatsApp Card */
  .whatsapp-card { margin: 25px auto; width: 100%; max-width: 300px; background: rgba(255, 255, 255, 0.05); padding: 15px; border-radius: 15px; border: 1px solid rgba(255, 153, 51, 0.3); }
  .whatsapp-card h3 { color: #25D366; font-size: 14px; margin-bottom: 5px; }
  .whatsapp-card p { font-size: 11px; color: #ccc; margin-bottom: 12px; }
  .btn-wa { display: inline-block; background: linear-gradient(135deg, #25D366, #128C7E); color: white; text-decoration: none; font-weight: 700; padding: 8px 20px; border-radius: 50px; font-size: 12px; }
</style>
</head>
<body>

<h1>🇮🇳 Happy Independence Day 🇮🇳</h1>
<p class="subtitle">Maa Kali Vastralaya - Spin & Win</p>

<div class="wheel-box">
  <div class="pointer"></div>
  <canvas id="wheelCanvas" width="1000" height="1000"></canvas>
</div>

<button class="btn-spin" onclick="startSpin()">SPIN THE WHEEL</button>
<div id="rewardDisplay"></div>

<div class="whatsapp-card">
  <h3>📲 Offers & Updates</h3>
  <p>WhatsApp Group se judein aur Independence Day discounts paayein!</p>
  <a href="https://chat.whatsapp.com/FVJhXgslm2u3Lfylbncdop" target="_blank" class="btn-wa">
    💬 Join WhatsApp Group
  </a>
</div>

<script>
const STATUS_URL = "https://maa-kali-rewards-default-rtdb.firebaseio.com/status.json";
const TARGET_URL = "https://maa-kali-rewards-default-rtdb.firebaseio.com/targetReward.json";

const rewardsList = [
  { name: "Handkerchief", worth: "₹20" },
  { name: "Face Towel", worth: "₹40" },
  { name: "Short Dupatta", worth: "₹99" },
  { name: "₹50 OFF", worth: "Discount" },
  { name: "Big Towel", worth: "₹150" },
  { name: "FREE SHOPPING", worth: "Bumper Prize" }
];

const colors = ["#FF9933", "#000080", "#138808", "#FF9933", "#000080", "#138808"];
const canvas = document.getElementById("wheelCanvas");
const ctx = canvas.getContext("2d");
const numSegments = rewardsList.length;
const anglePerSegment = (2 * Math.PI) / numSegments;
let currentRotationAngle = 0;
let isSpinning = false;
let audioCtx = null;
let lastSegmentIndex = -1;

function initAudio() { if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)(); }

function playClickSound() {
  if (!audioCtx) return;
  const osc = audioCtx.createOscillator();
  const gain = audioCtx.createGain();
  osc.type = 'triangle'; osc.frequency.setValueAtTime(400, audioCtx.currentTime);
  gain.gain.setValueAtTime(0.1, audioCtx.currentTime); 
  gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
  osc.connect(gain); gain.connect(audioCtx.destination); osc.start(); osc.stop(audioCtx.currentTime + 0.1);
}

function playWinSound() {
  if (!audioCtx) return;
  const notes = [261.63, 329.63, 392.00, 523.25];
  notes.forEach((freq, index) => {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'sine'; osc.frequency.setValueAtTime(freq, audioCtx.currentTime + index * 0.1);
    gain.gain.setValueAtTime(0.2, audioCtx.currentTime + index * 0.1);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + index * 0.1 + 0.2);
    osc.connect(gain); gain.connect(audioCtx.destination); osc.start(audioCtx.currentTime + index * 0.1); osc.stop(audioCtx.currentTime + index * 0.1 + 0.2);
  });
}

function drawWheel() {
  ctx.clearRect(0, 0, 1000, 1000);
  for (let i = 0; i < numSegments; i++) {
    const angle = currentRotationAngle + i * anglePerSegment;
    ctx.beginPath();
    ctx.moveTo(500, 500);
    ctx.arc(500, 500, 480, angle, angle + anglePerSegment);
    ctx.fillStyle = colors[i % colors.length];
    ctx.fill();
    ctx.stroke();

    ctx.save();
    ctx.translate(500, 500);
    ctx.rotate(angle + anglePerSegment / 2);
    ctx.textAlign = "right";
    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 40px Poppins";
    ctx.fillText(rewardsList[i].name, 440, 10);
    ctx.restore();
  }

  const normalizedAngle = (360 - ((currentRotationAngle * 180 / Math.PI) % 360) + 270) % 360;
  const currentSegment = Math.floor(normalizedAngle / (360 / numSegments));
  if (currentSegment !== lastSegmentIndex && isSpinning) { playClickSound(); lastSegmentIndex = currentSegment; }
}

drawWheel();

function startSpin() {
  if (isSpinning) return;
  initAudio();
  const display = document.getElementById("rewardDisplay");
  display.innerText = "⏳ Checking...";
  display.style.display = "block";

  fetch(STATUS_URL)
  .then(res => res.json())
  .then(statusData => {
    if (statusData && statusData.active === "ON") {
      fetch(STATUS_URL, { method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ active: "OFF" }) });
      fetch(TARGET_URL)
      .then(res => res.json())
      .then(targetReward => {
        let winIndex = rewardsList.findIndex(r => r.name === targetReward);
        if (winIndex === -1) winIndex = 0;
        
        isSpinning = true;
        const totalTargetDeg = (6 * 360) + (360 - (winIndex * (360 / numSegments) + (360 / numSegments) / 2) - 90);
        const startRad = currentRotationAngle;
        const duration = 5000;
        let startTime = null;

        function animate(timestamp) {
          if (!startTime) startTime = timestamp;
          const progress = Math.min((timestamp - startTime) / duration, 1);
          const ease = 1 - Math.pow(1 - progress, 3);
          currentRotationAngle = startRad + (totalTargetDeg * Math.PI / 180) * ease;
          drawWheel();
          if (progress < 1) requestAnimationFrame(animate);
          else {
            isSpinning = false;
            playWinSound();
            display.innerText = `🎉 Mubarak ho!\nJeeta hai: ${rewardsList[winIndex].name}\nWorth: ${rewardsList[winIndex].worth}`;
          }
        }
        requestAnimationFrame(animate);
      });
    } else {
      display.innerText = "🛍️ Wheel ghumane ke liye pehle kharidari karein!";
    }
  });
}
</script>
</body>
</html>
