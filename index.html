<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maa Kali Rewards</title>
<link rel="stylesheet" href="style.css">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
  body { 
    background: radial-gradient(circle at top, #1a0203 0%, #080102 100%);
    color: #ffffff;
    text-align: center; 
    padding: 25px 15px 40px; 
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .logo-container {
    width: 150px;
    height: 150px;
    margin: 10px auto 15px;
    border-radius: 50%;
    padding: 4px;
    background: linear-gradient(135deg, #ffd700, #ff4500, #ffd700);
    box-shadow: 0 0 30px rgba(255, 69, 0, 0.8);
    animation: glow 3s infinite alternate;
    display: flex;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }
  .logo-img {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    background-color: #000000;
  }
  @keyframes glow {
    0% { box-shadow: 0 0 15px rgba(255, 215, 0, 0.5); }
    100% { box-shadow: 0 0 35px rgba(255, 69, 0, 0.9); }
  }
  h1 { color: #ffd700; font-size: 26px; font-weight: 800; letter-spacing: 0.5px; text-shadow: 0 2px 10px rgba(255, 215, 0, 0.3); margin-bottom: 4px; }
  .subtitle { color: #d1c4e9; font-size: 14px; font-weight: 500; margin-bottom: 25px; opacity: 0.9; }
  .btn { 
    background: linear-gradient(135deg, #d32f2f, #9a0007);
    color: #ffffff; 
    border: 2px solid #ffb300; 
    padding: 16px 32px; 
    font-size: 18px; 
    font-weight: 700; 
    border-radius: 50px; 
    cursor: pointer; 
    box-shadow: 0 6px 20px rgba(211, 47, 47, 0.5); 
    transition: all 0.3s ease;
    width: 100%;
    max-width: 320px;
  }
  .btn:active { transform: scale(0.96); }
  #rewardDisplay { margin: 25px auto 0; width: 100%; max-width: 320px; font-size: 17px; font-weight: 600; padding: 18px; border-radius: 16px; display: none; line-height: 1.5; }
  .whatsapp-card {
    margin: 30px auto 0;
    width: 100%;
    max-width: 320px;
    background: rgba(255, 255, 255, 0.05);
    padding: 20px 16px;
    border-radius: 18px;
    border: 1px solid rgba(255, 215, 0, 0.2);
    box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
  }
  .whatsapp-card h3 { margin: 0 0 6px 0; color: #25D366; font-size: 17px; font-weight: 700; }
  .whatsapp-card p { font-size: 12px; color: #cccccc; margin-bottom: 16px; line-height: 1.4; }
  .btn-wa {
    display: inline-block;
    background: linear-gradient(135deg, #25D366, #128C7E);
    color: white;
    text-decoration: none;
    font-weight: 700;
    padding: 12px 24px;
    border-radius: 50px;
    font-size: 14px;
    box-shadow: 0 4px 15px rgba(37, 211, 102, 0.4);
  }
</style>
</head>
<body>

<div class="logo-container">
  <img src="1786193692481.png" alt="Maa Kali Logo" class="logo-img">
</div>

<h1>🎁 Maa Kali Rewards</h1>
<p class="subtitle">Welcome to Maa Kali Vastralaya</p>

<button class="btn" onclick="openMyReward()">Open Your Reward</button>

<div id="rewardDisplay"></div>

<div class="whatsapp-card">
  <h3>📲 Offers & Naye Stock Updates</h3>
  <p>Maa Kali Vastralaya ke WhatsApp Group se judein aur roz naye kapdon ke collection aur special discounts ki jankari paayein!</p>
  <a href="https://chat.whatsapp.com/FVJhXgslm2u3Lfylbncdop" target="_blank" class="btn-wa">
    💬 Join WhatsApp Group
  </a>
</div>

<script>
const REWARD_URL = "https://maa-kali-rewards-default-rtdb.firebaseio.com/reward.json";
const STATUS_URL = "https://maa-kali-rewards-default-rtdb.firebaseio.com/status.json";

function openMyReward() {
    const display = document.getElementById("rewardDisplay");
    display.style.display = "block";
    display.style.color = "#ffd700";
    display.style.backgroundColor = "rgba(255, 215, 0, 0.1)";
    display.style.border = "1px solid #ffd700";
    display.innerText = "⏳ Checking...";

    fetch(STATUS_URL)
    .then(res => res.json())
    .then(statusData => {
        if (statusData && statusData.active === "ON") {
            fetch(STATUS_URL, {
                method: "PUT",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ active: "OFF" })
            });
            fetch(REWARD_URL)
            .then(res => res.json())
            .then(data => {
                if (data && data.selectedReward) {
                    display.style.color = "#81c784";
                    display.style.backgroundColor = "rgba(46, 125, 50, 0.2)";
                    display.style.border = "1px solid #81c784";
                    display.innerText = "🎉 CONGRATULATIONS!\n\n" + data.selectedReward;
                } else {
                    display.innerText = "❌ Abhi koi reward set nahi hai.";
                }
            });
        } else {
            display.style.color = "#ff8a80";
            display.style.backgroundColor = "rgba(198, 40, 40, 0.2)";
            display.style.border = "1px solid #ff8a80";
            display.innerText = "🛍️ Reward paane ke liye pehle kharidari karein!";
        }
    })
    .catch(err => {
        display.style.color = "#ff8a80";
        display.style.backgroundColor = "rgba(198, 40, 40, 0.2)";
        display.innerText = "❌ Network Error! Internet check karke dobara try karein.";
    });
}
</script>

</body>
</html>
