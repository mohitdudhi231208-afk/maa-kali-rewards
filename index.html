<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maa Kali Rewards - Spin & Win</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
  body { 
    background: radial-gradient(circle at top, #1a0203 0%, #080102 100%);
    color: #ffffff;
    text-align: center; 
    padding: 20px 15px; 
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .logo-container {
    width: 100px;
    height: 100px;
    margin: 5px auto 10px;
    border-radius: 50%;
    padding: 3px;
    background: linear-gradient(135deg, #ffd700, #ff4500, #ffd700);
    box-shadow: 0 0 20px rgba(255, 69, 0, 0.7);
  }
  .logo-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: #000; }

  h1 { color: #ffd700; font-size: 22px; font-weight: 800; text-shadow: 0 2px 10px rgba(255,215,0,0.3); }
  .subtitle { color: #d1c4e9; font-size: 13px; margin-bottom: 20px; }

  /* Wheel Container Layout */
  .wheel-box {
    position: relative;
    width: 300px;
    height: 300px;
    margin: 10px auto 20px;
  }

  /* Pointer Arrow */
  .pointer {
    position: absolute;
    top: -12px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 15px solid transparent;
    border-right: 15px solid transparent;
    border-top: 25px solid #ffd700;
    z-index: 10;
    filter: drop-shadow(0 2px 5px rgba(0,0,0,0.5));
  }

  /* Canvas Wheel */
  #wheelCanvas {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    box-shadow: 0 0 20px rgba(255, 215, 0, 0.4);
    border: 5px solid #ffd700;
  }

  /* Spin Button */
  .btn-spin { 
    background: linear-gradient(135deg, #d32f2f, #9a0007);
    color: #ffffff; 
    border: 2px solid #ffb300; 
    padding: 14px 28px; 
    font-size: 16px; 
    font-weight: 700; 
    border-radius: 50px; 
    cursor: pointer; 
    box-shadow: 0 6px 20px rgba(211, 47, 47, 0.5); 
    width: 100%;
    max-width: 280px;
  }
  .btn-spin:active { transform: scale(0.96); }

  /* Result Display */
  #rewardDisplay { 
    margin: 20px auto 0; 
    width: 100%;
    max-width: 300px; 
    font-size: 16px; 
    font-weight: 600; 
    padding: 15px; 
    border-radius: 12px; 
    display: none; 
  }

  /* WhatsApp Box */
  .whatsapp-card {
    margin: 25px auto 0;
    width: 100%;
    max-width: 300px;
    background: rgba(255, 255, 255, 0.05);
    padding: 15px;
    border-radius: 15px;
    border: 1px solid rgba(255, 215, 0, 0.2);
  }
  .whatsapp-card h3 { color: #25D366; font-size: 15px; margin-bottom: 5px; }
  .whatsapp-card p { font-size: 11px; color: #ccc; margin-bottom: 12px; }
  .btn-wa {
    display: inline-block;
    background: linear-gradient(135deg, #25D366, #128C7E);
    color: white;
    text-decoration: none;
    font-weight: 700;
    padding: 10px 20px;
    border-radius: 50px;
    font-size: 13px;
  }
</style>
</head>
<body>

<div class="logo-container">
  <img src="1786193692481.png" alt="Maa Kali Logo" class="logo-img">
</div>

<h1>🎁 Maa Kali Spin & Win</h1>
<p class="subtitle">Welcome to Maa Kali Vastralaya</p>

<!-- Wheel Section -->
<div class="wheel-box">
  <div class="pointer"></div>
  <canvas id="wheelCanvas" width="300" height="300"></canvas>
</div>

<button class="btn-spin" onclick="startSpin()">SPIN THE WHEEL</button>

<div id="rewardDisplay"></div>

<div class="whatsapp-card">
  <h3>📲 Offers & Updates</h3>
  <p>WhatsApp Group se judein aur roz naye discounts paayein!</p>
  <a href="https://chat.whatsapp.com/FVJhXgslm2u3Lfylbncdop" target="_blank" class="btn-wa">
    💬 Join WhatsApp Group
  </a>
</div>

<script>
const STATUS_URL = "https://maa-kali-rewards-default-rtdb.firebaseio.com/status.json";

// Updated Rewards List with "Free Shopping"
const rewards = [
  "Face Towel",
  "FREE SHOPPING",
  "Handkerchief",
  "Short Dupatta",
  "₹50 OFF",
  "Big Towel"
];

const colors = ["#b71c1c", "#ffd700", "#1565c0", "#f57c00", "#2e7d32", "#6a1b9a"];

const canvas = document.getElementById("wheelCanvas");
const ctx = canvas.getContext("2d");
const numSegments = rewards.length;
const anglePerSegment = (2 * Math.PI) / numSegments;
let startAngle = 0;
let isSpinning = false;

// Draw Wheel
function drawWheel() {
  for (let i = 0; i < numSegments; i++) {
    const angle = startAngle + i * anglePerSegment;
    ctx.beginPath();
    ctx.arc(150, 150, 145, angle, angle + anglePerSegment);
    ctx.lineTo(150, 150);
    ctx.fillStyle = colors[i];
    ctx.fill();
    ctx.lineWidth = 2;
    ctx.strokeStyle = "#ffffff";
    ctx.stroke();

    // Draw Text
    ctx.save();
    ctx.translate(150, 150);
    ctx.rotate(angle + anglePerSegment / 2);
    ctx.textAlign = "right";
    ctx.fillStyle = colors[i] === "#ffd700" ? "#000000" : "#ffffff";
    ctx.font = "bold 11px Poppins";
    ctx.fillText(rewards[i], 135, 4);
    ctx.restore();
  }
}

drawWheel();

function startSpin() {
  if (isSpinning) return;

  const display = document.getElementById("rewardDisplay");
  display.style.display = "block";
  display.style.color = "#ffd700";
  display.style.backgroundColor = "rgba(255, 215, 0, 0.1)";
  display.style.border = "1px solid #ffd700";
  display.innerText = "⏳ Access check ho raha hai...";

  // Check Status from Firebase
  fetch(STATUS_URL)
  .then(res => res.json())
  .then(statusData => {
    if (statusData && statusData.active === "ON") {
      
      // Auto Turn OFF status in Firebase
      fetch(STATUS_URL, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ active: "OFF" })
      });

      // Start Wheel Rotation
      isSpinning = true;
      display.innerText = "🎰 Wheel ghoom raha hai...";

      const winIndex = Math.floor(Math.random() * numSegments);
      const randomRotations = 5 * 360;
      
      const targetSegmentAngle = 360 - (winIndex * (360 / numSegments) + (360 / numSegments) / 2) - 90;
      const totalRotation = randomRotations + targetSegmentAngle;
      
      let currentRotation = 0;
      const spinInterval = setInterval(() => {
        currentRotation += 15;
        startAngle = (currentRotation * Math.PI) / 180;
        drawWheel();

        if (currentRotation >= totalRotation) {
          clearInterval(spinInterval);
          isSpinning = false;

          // Show Final Reward
          display.style.color = "#81c784";
          display.style.backgroundColor = "rgba(46, 125, 50, 0.2)";
          display.style.border = "1px solid #81c784";
          display.innerText = "🎉 CONGRATULATIONS!\n\nAapne jeeta hai:\n" + rewards[winIndex];
        }
      }, 20);

    } else {
      display.style.color = "#ff8a80";
      display.style.backgroundColor = "rgba(198, 40, 40, 0.2)";
      display.style.border = "1px solid #ff8a80";
      display.innerText = "🛍️ Wheel ghumane ke liye pehle kharidari karein!";
    }
  })
  .catch(err => {
    display.style.color = "#ff8a80";
    display.style.backgroundColor = "rgba(198, 40, 40, 0.2)";
    display.innerText = "❌ Network Error! Internet check karein.";
  });
}
</script>

</body>
</html>
