<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maa Kali Rewards - Spin & Win</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
  body { 
    background: radial-gradient(circle at top, #2b0306 0%, #080102 100%);
    color: #ffffff;
    text-align: center; 
    padding: 20px 15px; 
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
  }

  .logo-container {
    width: 95px;
    height: 95px;
    margin: 5px auto 10px;
    border-radius: 50%;
    padding: 3px;
    background: linear-gradient(135deg, #ffd700, #ff4500, #ffd700);
    box-shadow: 0 0 25px rgba(255, 215, 0, 0.6);
  }
  .logo-img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; background: #000; }

  h1 { color: #ffd700; font-size: 22px; font-weight: 800; text-shadow: 0 2px 10px rgba(255,215,0,0.4); margin-bottom: 3px; }
  .subtitle { color: #d1c4e9; font-size: 13px; margin-bottom: 10px; }

  .wheel-box {
    position: relative;
    width: 320px;
    height: 320px;
    margin: 20px auto;
    border-radius: 50%;
    padding: 6px;
    background: linear-gradient(145deg, #ffd700, #b8860b, #ff8c00, #ffd700);
    box-shadow: 0 0 30px rgba(255, 215, 0, 0.5), inset 0 0 15px rgba(0,0,0,0.8);
  }

  .center-cap {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    width: 48px;
    height: 48px;
    background: radial-gradient(circle, #ffe066 0%, #d4af37 60%, #8a6d0b 100%);
    border-radius: 50%;
    z-index: 8;
    border: 3px solid #ffffff;
    box-shadow: 0 4px 10px rgba(0,0,0,0.6);
  }

  .pointer {
    position: absolute;
    top: -20px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 18px solid transparent;
    border-right: 18px solid transparent;
    border-top: 32px solid #ff0000;
    z-index: 10;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.8));
  }
  .pointer::after {
    content: '';
    position: absolute;
    top: -32px;
    left: -8px;
    width: 0;
    height: 0;
    border-left: 8px solid transparent;
    border-right: 8px solid transparent;
    border-top: 15px solid #ffe066;
  }

  #wheelCanvas {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    display: block;
  }

  .btn-spin { 
    background: linear-gradient(135deg, #ff1744, #b71c1c);
    color: #ffffff; 
    border: 2px solid #ffd700; 
    padding: 14px 35px; 
    font-size: 16px; 
    font-weight: 800; 
    border-radius: 50px; 
    cursor: pointer; 
    box-shadow: 0 6px 20px rgba(255, 23, 68, 0.6), 0 0 15px rgba(255, 215, 0, 0.4); 
    width: 100%;
    max-width: 280px;
    letter-spacing: 1px;
  }
  .btn-spin:active { transform: scale(0.95); }

  #rewardDisplay { 
    margin: 20px auto 0; 
    width: 100%;
    max-width: 300px; 
    font-size: 15px; 
    font-weight: 600; 
    padding: 15px; 
    border-radius: 12px; 
    display: none; 
    white-space: pre-line;
  }

  .whatsapp-card {
    margin: 20px auto 0;
    width: 100%;
    max-width: 300px;
    background: rgba(255, 255, 255, 0.05);
    padding: 12px;
    border-radius: 15px;
    border: 1px solid rgba(255, 215, 0, 0.3);
  }
  .whatsapp-card h3 { color: #25D366; font-size: 14px; margin-bottom: 4px; }
  .whatsapp-card p { font-size: 11px; color: #ccc; margin-bottom: 10px; }
  .btn-wa {
    display: inline-block;
    background: linear-gradient(135deg, #25D366, #128C7E);
    color: white;
    text-decoration: none;
    font-weight: 700;
    padding: 8px 18px;
    border-radius: 50px;
    font-size: 12px;
  }
</style>
</head>
<body>

<div class="logo-container">
  <img src="1786193692481.png" alt="Maa Kali Logo" class="logo-img">
</div>

<h1>🎰 Maa Kali Spin & Win</h1>
<p class="subtitle">Maa Kali Vastralaya - Special Rewards</p>

<div class="wheel-box">
  <div class="pointer"></div>
  <div class="center-cap"></div>
  <canvas id="wheelCanvas" width="1000" height="1000"></canvas>
</div>

<button class="btn-spin" onclick="startSpin()">SPIN THE WHEEL</button>

<div id="rewardDisplay"></div>

<div class="whatsapp-card">
  <h3>📲 Offers & Updates</h3>
  <p>WhatsApp Group se judein aur roz naye discounts paayein!</p>
  <a href="https://chat.whatsapp.com/FVJhXgslm2u3Lfylbncdop" target="_blank" class="btn-wa">
    💬 Join WhatsApp Group
  </a>
</div>

<script>
const STATUS_URL = "https://maa-kali-rewards-default-rtdb.firebaseio.com/status.json";
const TARGET_URL = "https://maa-kali-rewards-default-rtdb.firebaseio.com/targetReward.json";

// Admin Panel ke saare 6 Items yaha exact sync hain:
const rewardsList = [
  { name: "Face Towel", worth: "Worth ₹50" },
  { name: "Big Face Towel", worth: "Worth ₹120" },
  { name: "Handkerchief", worth: "Worth ₹25" },
  { name: "Short Dupatta", worth: "Worth ₹50" },
  { name: "₹50 OFF", worth: "Next Purchase" },
  { name: "FREE SHOPPING", worth: "Bumper Prize" }
];

const colors = ["#d32f2f", "#1976d2", "#f57c00", "#388e3c", "#7b1fa2", "#e65100"];

const canvas = document.getElementById("wheelCanvas");
const ctx = canvas.getContext("2d");
const numSegments = rewardsList.length;
const arcSize = (2 * Math.PI) / numSegments;
let currentRotationAngle = 0;
let isSpinning = false;
let lastSegmentIndex = -1;

let audioCtx = null;

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
}

function playClickSound() {
  if (!audioCtx) return;
  try {
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(600, audioCtx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.05);
    gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    osc.stop(audioCtx.currentTime + 0.05);
  } catch(e) {}
}

function playWinSound() {
  if (!audioCtx) return;
  try {
    const notes = [261.63, 329.63, 392.00, 523.25];
    notes.forEach((freq, index) => {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, audioCtx.currentTime + index * 0.12);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime + index * 0.12);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + index * 0.12 + 0.3);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start(audioCtx.currentTime + index * 0.12);
      osc.stop(audioCtx.currentTime + index * 0.12 + 0.3);
    });
  } catch(e) {}
}

function drawWheel() {
  ctx.clearRect(0, 0, 1000, 1000);

  for (let i = 0; i < numSegments; i++) {
    const angle = currentRotationAngle + i * arcSize;
    
    ctx.beginPath();
    ctx.moveTo(500, 500);
    ctx.arc(500, 500, 480, angle, angle + arcSize);
    ctx.fillStyle = colors[i % colors.length];
    ctx.fill();
    ctx.lineWidth = 6;
    ctx.strokeStyle = "#ffffff";
    ctx.stroke();

    const dotAngle = angle;
    const dotX = 500 + 465 * Math.cos(dotAngle);
    const dotY = 500 + 465 * Math.sin(dotAngle);
    ctx.beginPath();
    ctx.arc(dotX, dotY, 9, 0, 2 * Math.PI);
    ctx.fillStyle = "#ffffff";
    ctx.fill();

    ctx.save();
    ctx.translate(500, 500);
    ctx.rotate(angle + arcSize / 2);
    ctx.textAlign = "right";
    ctx.fillStyle = "#ffffff";
    
    ctx.font = "bold 32px Poppins";
    ctx.shadowColor = "rgba(0,0,0,0.8)";
    ctx.shadowBlur = 8;
    ctx.fillText(rewardsList[i].name, 430, -5);

    ctx.font = "600 20px Poppins";
    ctx.fillStyle = "#ffd700";
    ctx.fillText(rewardsList[i].worth, 430, 28);

    ctx.restore();
  }

  const pointerAngle = 3 * Math.PI / 2;
  const currentAngleOnPointer = (pointerAngle - currentRotationAngle) % (2 * Math.PI);
  const normalizedAngle = (currentAngleOnPointer + 2 * Math.PI) % (2 * Math.PI);
  const currentSegment = Math.floor(normalizedAngle / arcSize);

  if (currentSegment !== lastSegmentIndex && isSpinning) {
    playClickSound();
    lastSegmentIndex = currentSegment;
  }
}

drawWheel();

function startSpin() {
  if (isSpinning) return;
  initAudio();

  const display = document.getElementById("rewardDisplay");
  display.style.display = "block";
  display.style.color = "#ffd700";
  display.style.backgroundColor = "rgba(255, 215, 0, 0.1)";
  display.style.border = "1px solid #ffd700";
  display.innerText = "⏳ Checking...";

  fetch(STATUS_URL)
  .then(res => res.json())
  .then(statusData => {
    if (statusData && statusData.active === "ON") {
      
      fetch(STATUS_URL, {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ active: "OFF" })
      });

      fetch(TARGET_URL)
      .then(res => res.json())
      .then(targetReward => {
        const cleanedTarget = String(targetReward).toLowerCase().trim();
        
        let winIndex = -1;

        if (cleanedTarget.includes("free shopping")) {
          winIndex = 5;
        } else if (cleanedTarget.includes("big face towel")) {
          winIndex = 1;
        } else if (cleanedTarget.includes("face towel")) {
          winIndex = 0;
        } else if (cleanedTarget.includes("handkerchief")) {
          winIndex = 2;
        } else if (cleanedTarget.includes("dupatta")) {
          winIndex = 3;
        } else if (cleanedTarget.includes("50 off") || cleanedTarget.includes("purchase")) {
          winIndex = 4;
        }

        if (winIndex === -1) winIndex = 0;

        isSpinning = true;
        display.innerText = "🎰 Wheel ghoom raha hai...";

        currentRotationAngle = currentRotationAngle % (2 * Math.PI);

        const targetAngleForIndex = (3 * Math.PI / 2) - (winIndex + 0.5) * arcSize;
        const extraRounds = 5 * 2 * Math.PI;
        
        let targetRotation = targetAngleForIndex;
        while (targetRotation <= currentRotationAngle) {
          targetRotation += 2 * Math.PI;
        }
        targetRotation += extraRounds;

        const startRad = currentRotationAngle;
        let startTime = null;
        const duration = 5000;

        function easeOutCubic(t) {
          return 1 - Math.pow(1 - t, 3);
        }

        function animateWheel(timestamp) {
          if (!startTime) startTime = timestamp;
          const elapsed = timestamp - startTime;
          const progress = Math.min(elapsed / duration, 1);

          const easeProgress = easeOutCubic(progress);
          currentRotationAngle = startRad + (targetRotation - startRad) * easeProgress;

          drawWheel();

          if (progress < 1) {
            requestAnimationFrame(animateWheel);
          } else {
            isSpinning = false;
            currentRotationAngle = targetRotation % (2 * Math.PI);
            drawWheel();
            playWinSound();
            
            display.style.color = "#81c784";
            display.style.backgroundColor = "rgba(46, 125, 50, 0.2)";
            display.style.border = "1px solid #81c784";
            display.innerText = `🎉 CONGRATULATIONS!\n\nAapne jeeta hai:\n${rewardsList[winIndex].name}\n(${rewardsList[winIndex].worth})`;
          }
        }

        requestAnimationFrame(animateWheel);
      });

    } else {
      display.style.color = "#ff8a80";
      display.style.backgroundColor = "rgba(198, 40, 40, 0.2)";
      display.style.border = "1px solid #ff8a80";
      display.innerText = "🛍️ Wheel ghumane ke liye pehle kharidari karein!";
    }
  })
  .catch(err => {
    display.style.color = "#ff8a80";
    display.style.backgroundColor = "rgba(198, 40, 40, 0.2)";
    display.innerText = "❌ Network Error! Internet check karein.";
  });
}
</script>

</body>
</html>
