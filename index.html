<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Maa Kali Vastralaya - Digital Loyalty Card</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', sans-serif; }
  body { background: #0f0a10; color: #fff; padding: 15px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
  
  .card {
    background: linear-gradient(135deg, #1f1225, #3a1523);
    border: 2px solid #ffd700;
    border-radius: 20px;
    width: 100%; max-width: 400px;
    padding: 20px; box-shadow: 0 0 20px rgba(255, 215, 0, 0.2);
    margin-bottom: 20px;
  }
  
  .header { text-align: center; border-bottom: 1px dashed rgba(255,215,0,0.3); padding-bottom: 12px; margin-bottom: 15px; }
  .header h2 { color: #ffd700; font-size: 20px; }
  .header p { color: #d1c4e9; font-size: 12px; }

  .user-info { display: flex; justify-content: space-between; margin-bottom: 15px; font-size: 14px; }
  .user-info span { color: #ffd700; font-weight: 700; }

  .progress-box { background: rgba(0,0,0,0.4); padding: 15px; border-radius: 12px; margin-bottom: 15px; }
  .progress-bar-bg { background: #333; height: 14px; border-radius: 7px; overflow: hidden; margin: 8px 0; }
  .progress-bar-fill { background: linear-gradient(90deg, #ff4500, #ffd700); height: 100%; width: 0%; transition: width 0.5s ease; }

  .milestone-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin-top: 15px; }
  .m-box {
    background: #2a1b2d; border: 1px solid #555; border-radius: 8px; padding: 8px 4px;
    text-align: center; font-size: 11px; font-weight: 600;
  }
  .m-box.done { background: #1b5e20; border-color: #81c784; color: #fff; }
  .m-box.gift { background: #e65100; border-color: #ffd700; color: #fff; animation: pulse 1.5s infinite; }
  .m-box.redeemed { background: #37474f; border-color: #78909c; color: #aaa; }

  @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.05); } 100% { transform: scale(1); } }

  .login-box { background: #1f1225; padding: 20px; border-radius: 16px; width: 100%; max-width: 400px; text-align: center; border: 1px solid #ffd700; margin-top: 30px; }
  input { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid #ffd700; background: #000; color: #fff; margin: 10px 0; font-size: 16px; text-align: center; }
  button { width: 100%; padding: 12px; border-radius: 8px; border: none; background: #ffd700; color: #000; font-weight: 800; font-size: 15px; cursor: pointer; }
</style>
</head>
<body>

<div class="header">
  <h2>❤️ Maa Kali Vastralaya</h2>
  <p>Digital Loyalty & Rewards Program</p>
</div>

<div id="loginSection" class="login-box">
  <h3>📲 Loyalty Card Kholein</h3>
  <p style="font-size: 12px; color: #aaa; margin-top: 5px;">Registered Mobile Number Dalein:</p>
  <input type="tel" id="mobileInput" placeholder="10-Digit Mobile Number" maxlength="10">
  <button onclick="loadCustomerData()">Open Loyalty Card</button>
</div>

<div id="dashboardSection" style="display: none; width: 100%; max-width: 400px;">
  <div class="card">
    <div class="user-info">
      <div>Name: <span id="custName">-</span></div>
      <div>ID: <span id="custId">-</span></div>
    </div>

    <div class="progress-box">
      <div style="display: flex; justify-content: space-between; font-size: 13px;">
        <span>Loyalty Progress</span>
        <span id="purchaseCountText">0 / 10 Purchases</span>
      </div>
      <div class="progress-bar-bg">
        <div id="progressFill" class="progress-bar-fill"></div>
      </div>
      <p id="nextRewardMsg" style="font-size: 12px; color: #ffd700; margin-top: 5px; text-align: center;">Next Gift: 3rd Purchase</p>
    </div>

    <div style="font-size: 13px; font-weight: 700; margin-bottom: 8px;">🏆 10-Purchase Cycle</div>
    <div class="milestone-grid" id="gridContainer"></div>
  </div>
</div>

<script>
const DB_URL = "https://maa-kali-rewards-default-rtdb.firebaseio.com/";

function loadCustomerData() {
  const mobile = document.getElementById("mobileInput").value.trim();
  if(mobile.length !== 10) { alert("Sahi 10-digit mobile number dalein!"); return; }

  fetch(`${DB_URL}customers/${mobile}.json`)
    .then(res => res.json())
    .then(data => {
      if(!data) {
        alert("Aapka account nahi mila! Dukan par registration karayein.");
        return;
      }

      document.getElementById("loginSection").style.display = "none";
      document.getElementById("dashboardSection").style.display = "block";

      document.getElementById("custName").innerText = data.name;
      document.getElementById("custId").innerText = data.customerId || "MKV-NEW";

      const count = data.purchases || 0;
      const currentCycleCount = count % 10 === 0 && count > 0 ? 10 : count % 10;
      
      document.getElementById("purchaseCountText").innerText = `${currentCycleCount} / 10 Purchases`;
      document.getElementById("progressFill").style.width = `${(currentCycleCount / 10) * 100}%`;

      let nextGift = "3rd Purchase";
      if(currentCycleCount >= 3 && currentCycleCount < 5) nextGift = "5th Purchase";
      else if(currentCycleCount >= 5 && currentCycleCount < 8) nextGift = "8th Purchase";
      else if(currentCycleCount >= 8 && currentCycleCount < 10) nextGift = "10th Special Gift";
      else if(currentCycleCount === 10) nextGift = "Cycle Complete! 🎉";

      document.getElementById("nextRewardMsg").innerText = `Next Gift: ${nextGift}`;

      const grid = document.getElementById("gridContainer");
      grid.innerHTML = "";
      
      const giftsList = [3, 5, 8, 10];

      for(let i = 1; i <= 10; i++) {
        const box = document.createElement("div");
        box.className = "m-box";
        
        const isGiftSlot = giftsList.includes(i);
        const isCompleted = i <= currentCycleCount;

        if(isGiftSlot) {
          const giftState = (data.gifts && data.gifts[i]) ? data.gifts[i].status : "LOCKED";
          
          if(giftState === "REDEEMED") {
            box.classList.add("redeemed");
            box.innerHTML = `#${i}<br>✅`;
          } else if(isCompleted) {
            box.classList.add("gift");
            box.innerHTML = `#${i}<br>🎁 Unlocked`;
          } else {
            box.innerHTML = `#${i}<br>🎁 Gift`;
          }
        } else {
          if(isCompleted) box.classList.add("done");
          box.innerHTML = `#${i}<br>${isCompleted ? '✅' : '⚪'}`;
        }

        grid.appendChild(box);
      }
    });
}
</script>
</body>
</html>
